<div class="llama-rag-window" role="dialog" aria-label="Llama Rag Helper">
  <header class="llama-rag__header">
    <div>
      <div class="llama-rag__title">Llama Rag</div>
      <div class="llama-rag__subtitle">Blunt help for the builder.</div>
    </div>
    <button class="llama-rag__close" type="button">Close</button>
  </header>
  <div class="llama-rag__body">
    <div class="llama-rag__log" aria-live="polite"></div>
    <form class="llama-rag__composer">
      <input class="llama-rag__input" type="text" placeholder="Ask for help" aria-label="Ask Llama Rag" />
      <button class="llama-rag__send" type="submit">Send</button>
    </form>
  </div>
</div>
