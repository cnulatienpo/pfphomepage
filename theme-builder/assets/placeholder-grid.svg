<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d0d0d0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#f5f7fa"/>
  <rect width="200" height="200" fill="url(#grid)"/>
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#b0bec5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="16" fill="#78909c">Construction Grid</text>
</svg>
