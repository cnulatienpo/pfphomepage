<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="demo.css">
  <title>Construction Theme Demo</title>
</head>
<body>
  <div id="gate" aria-hidden="true" class="gate-out"></div>

  <section class="container scaffold taped crack">
    <article class="panel dim dim--x col-12 md-col-6 lg-col-4">
      <h3 class="scribble">Project A</h3>
      <p>Concrete poetry, literal concrete.</p>
    </article>
    <article class="panel col-12 md-col-6 lg-col-4">Project B</article>
    <article class="panel col-12 md-col-12 lg-col-4">
      <svg class="pipe" viewBox="0 0 400 200" aria-hidden="true">
        <path d="M10 40 H200 V160 H390" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="8" stroke-linecap="round"/>
        <path class="flow" d="M10 40 H200 V160 H390" fill="none" stroke="var(--color-primary,#e895c7)" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10">
          <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/>
        </path>
      </svg>
    </article>
  </section>

  <h2 class="scribble">Gallery</h2>
  <div class="panel panel--washer dim dim--x" style="position:relative; width:340px; min-height:160px;">
    <span class="blue-label" style="position:absolute; right:10px; top:10px;">A‑BAY 04</span>
    <span class="ring-gap" style="--size:16px; --thickness:2px; position:absolute; right:-6px; top:-6px;"></span>
    Marked up panel
  </div>

  <script src="demo.js" type="module"></script>
</body>
</html>
