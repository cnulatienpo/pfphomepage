<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ThemePlay</title>
  <link rel="stylesheet" href="css/themeplay.css" />
  <script type="module" src="js/themeplay-ui.js"></script>
</head>

<body>
  <div id="themeplay-root">

    <div id="themeplay-header">
      <div id="tp-title">ThemePlay</div>
      <div id="tp-subtitle">Play with the tools. Finish your theme.</div>
    </div>

    <div id="themeplay-goal-list"></div>

    <div id="themeplay-controls">
      <button id="tp-randomize" class="tp-btn">Randomize Something</button>
      <button id="tp-preview" class="tp-btn">Preview Mode</button>
      <button id="tp-help" class="tp-btn">Talk To Llama Rag</button>
    </div>

    <div id="themeplay-reward-panel" class="hidden">
      <div id="reward-title">Your theme is ready.</div>
      <div id="reward-sub">Everything looks settled. You can export now.</div>

      <button id="tp-export" class="tp-big-btn">Make My Theme</button>
      <button id="tp-replay" class="tp-btn">Play Again</button>
    </div>

  </div>
</body>
</html>
