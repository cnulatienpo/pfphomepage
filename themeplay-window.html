<div class="themeplay-window" role="complementary" aria-label="ThemePlay Panel">
  <header class="themeplay-header">
    <div>
      <div class="themeplay-title">ThemePlay</div>
      <div class="themeplay-subtitle">Play with the tools. Finish your theme.</div>
    </div>
    <button class="themeplay-close" type="button">Close</button>
  </header>
  <div class="themeplay-body">
    <div class="themeplay-actions">
      <button class="themeplay-btn themeplay-randomize" type="button">Randomize Something</button>
      <button class="themeplay-btn themeplay-preview" type="button">Preview Mode</button>
      <button class="themeplay-btn themeplay-help" type="button">Help</button>
    </div>
    <div class="themeplay-goals" aria-live="polite"></div>
    <div class="themeplay-feedback" aria-live="polite"></div>
  </div>
</div>
